[project]
name = "test-bench-rollers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charlie Melchiori", email = "cmelchiori@mafabrik.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "aioserial>=1.3.1",
    "mesh-schemas>=0.2.0",
    "textual>=8.2.8,<9",
]

[project.scripts]
test-bench-rollers = "test_bench_rollers:main"
test-bench-remote = "test_bench_rollers.remote_console:remote_main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
mesh-schemas = { path = "packages/mesh-schemas", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
